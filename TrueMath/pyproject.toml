[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truemath"
version = "1.0.0"
description = "TrueMath: real, verified math/physics/coding solvers — library + desktop research engine"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "sympy==1.14.0",
  "scipy==1.17.1",
  "cryptography==49.0.0",
  "python-dotenv==1.2.2",
  "certifi==2026.2.25",
  "ddgs==9.14.4",
]

[project.optional-dependencies]
desktop = [
  "pywebview==6.2.1",
  "reportlab==4.4.10",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==5.0.0",
  "pyinstaller==6.20.0",
  "hypothesis==6.156.4",
]

[project.scripts]
truemath = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.coverage.run]
source = ["src", "config", "main"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]

[tool.setuptools]
py-modules = ["config", "main", "cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
